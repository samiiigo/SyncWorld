name: Deploy Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-functions.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck functions
        run: npm run typecheck --workspace functions

      - name: Deploy
        run: echo "Deploy step goes here with Firebase credentials from GitHub Secrets"
